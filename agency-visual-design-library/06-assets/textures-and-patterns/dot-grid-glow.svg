<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Future Tech: dot grid on Void with violet and cyan glow fields. -->
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E8F2" fill-opacity=".14"/>
    </pattern>
    <radialGradient id="violet" cx="78%" cy="30%" r="45%">
      <stop offset="0" stop-color="#6C55F2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6C55F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="92%" cy="80%" r="35%">
      <stop offset="0" stop-color="#2DE2E6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2DE2E6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#0A0B14"/>
  <rect width="800" height="450" fill="url(#violet)"/>
  <rect width="800" height="450" fill="url(#cyan)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
</svg>
